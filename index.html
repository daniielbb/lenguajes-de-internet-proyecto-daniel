<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog oficial de Independiente Santa Fe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar__brand">
      <img class="navbar__logo" src="./images/escudo_santafe.webp" alt="Logo del blog">
    </div>
    <span class="navbar__divider"></span>
    <p class="navbar__text">Blog oficial de<br>Independiente Santa Fe</p>
  </nav>

  <section class="banner">
    <img class="banner__img" src="./images/banner.webp" alt="">
    <div class="banner__overlay"></div>

    <div class="banner__content">
      <h1 class="banner__headline">TODAS LAS NOTICIAS SOBRE EL CAMPEON DEL CONTINENTE</h1>
    </div>
  </section>

  <section class="news">
    <h2 class="news__section-title">Últimas noticias</h2>

    <div class="news__grid">
      <article class="news-card">
        <p class="news-card__eyebrow">SANTA FE V MILLONARIOS</p>

        <div class="news-card__media">
          <img class="news-card__img" src="./images/img_noticias.jpg" alt="">
          <div class="news-card__overlay"></div>
          <h3 class="news-card__headline">POR DENTRO DEL ENTRENAMIENTO: LISTOS PARA EL CLÁSICO</h3>
        </div>
      </article>
    </div>
  </section>

</body>
</html>
